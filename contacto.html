<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vertex Group | Contacto</title>
  <meta name="description" content="Contáctanos para cotizar tu proyecto de software, simulación o realidad extendida.">

  <link rel="icon" href="img/logo/favicon.jpg" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/tipografia.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <a href="#contenido-principal" class="saltar-enlace">Saltar al contenido principal</a>

  <header class="encabezado">
    <div class="contenedor barra-nav">
      <a href="index.html" class="logo" aria-label="Vertex Group, ir al inicio">
        <img src="img/logo/logo_principal.png" alt="Vertex Group" class="logo-img">
      </a>
      <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav-principal d-none d-lg-flex" aria-label="Navegación principal">
        <a href="index.html">Inicio</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="servicios.html">Servicios</a>
        <a href="faq.html">FAQ</a>
        <a href="blog.html">Blog</a>
      </nav>
      <div class="nav-acciones">
        <a href="contacto.html" class="btn btn-primary boton--primario" aria-current="page">Contáctanos</a>
      </div>
    </div>
  </header>

  <main id="contenido-principal">
    <section class="seccion seccion--alterna" style="padding-top: 160px; padding-bottom: 60px;">
      <div class="container text-center">
        <h1 style="font-size: clamp(2rem, 4vw, 3rem); margin-bottom: 1rem;">Contáctanos</h1>
        <p style="color: var(--texto-gris); font-size: 1.15rem;">Cuéntanos sobre tu proyecto y te responderemos en menos de 48 horas.</p>
      </div>
    </section>

    <section class="seccion">
      <div class="container">
        <form class="row g-3 mx-auto" action="#" method="POST" style="max-width: 800px;">
          <div class="col-md-6 campo">
            <label for="nombre" class="form-label">Nombre completo</label>
            <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Tu nombre" required>
          </div>
          <div class="col-md-6 campo">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="tu@correo.com" required>
          </div>
          <div class="col-md-6 campo">
            <label for="empresa" class="form-label">Empresa (opcional)</label>
            <input type="text" class="form-control" id="empresa" name="empresa" placeholder="Nombre de tu empresa">
          </div>
          <div class="col-md-6 campo">
            <label for="servicio" class="form-label">Servicio de interés</label>
            <select class="form-select" id="servicio" name="servicio" required>
              <option value="">Selecciona un servicio</option>
              <option value="software">Desarrollo de Software</option>
              <option value="xr">Realidad Extendida (XR)</option>
              <option value="simulacion">Simulación y Modelado</option>
              <option value="consultoria">Consultoría Tecnológica</option>
            </select>
          </div>
          <div class="col-12 campo">
            <label for="mensaje" class="form-label">Mensaje</label>
            <textarea class="form-control" id="mensaje" name="mensaje" rows="6" placeholder="Cuéntanos sobre tu proyecto, objetivos y plazos..." required></textarea>
          </div>
